<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="light-mode">
    <div class="container">
        <header class="header">
            <h1>Expense & Budget Visualizer</h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
                ??
            </button>
        </header>

        <main class="main-content">
            <section class="budget-section">
                <label for="budget-limit">Budget Limit (Rp):</label>
                <input type="number" id="budget-limit" min="0.01" max="999999999.99" step="0.01" placeholder="Set your budget">
                <div id="budget-warning" class="budget-warning" role="alert"></div>
            </section>

            <section class="balance-section">
                <div class="balance-card">
                    <h2>Total Spending</h2>
                    <p id="total-amount" class="total-amount">Rp0</p>
                </div>
            </section>

            <section class="form-section">
                <h2>Add Transaction</h2>
                <form id="transaction-form" class="transaction-form">
                    <div class="form-group">
                        <label for="item-name">Item Name:</label>
                        <input type="text" id="item-name" maxlength="100" placeholder="Enter item name" required>
                        <span class="error-message" id="item-name-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (Rp):</label>
                        <input type="number" id="amount" min="0.01" max="999999999.99" step="0.01" placeholder="Enter amount" required>
                        <span class="error-message" id="amount-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="category">Category:</label>
                        <select id="category" required>
                            <option value="">Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Fun">Fun</option>
                        </select>
                        <span class="error-message" id="category-error"></span>
                    </div>

                    <button type="submit" class="btn-primary">Add Transaction</button>
                </form>
            </section>

            <section class="controls-section">
                <div class="sort-section">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select">
                        <option value="chronological">Chronological (Newest First)</option>
                        <option value="amount-asc">Amount (Low to High)</option>
                        <option value="amount-desc">Amount (High to Low)</option>
                        <option value="category-asc">Category (A-Z)</option>
                    </select>
                </div>
            </section>

            <section class="transactions-section">
                <h2>Transactions</h2>
                <div id="transaction-list" class="transaction-list">
                    <p class="empty-message">No transactions recorded yet.</p>
                </div>
            </section>

            <section class="chart-section">
                <h2>Spending by Category</h2>
                <div class="chart-container">
                    <canvas id="category-chart"></canvas>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Built with HTML, CSS, and Vanilla JavaScript</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
